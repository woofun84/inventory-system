<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 库存进出库管理系统</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/theme-dark.css">
<style>
  body { margin: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap { width: 360px; max-width: 92vw; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.12); padding: 40px 32px; }
  .login-logo { text-align: center; font-size: 40px; margin-bottom: 8px; }
  .login-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .login-sub { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
  .login-form .form-group { margin-bottom: 16px; }
  .login-form label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .login-form input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); box-sizing: border-box; }
  .login-form input:focus { outline: none; border-color: var(--primary); }
  .login-btn { width: 100%; padding: 11px; font-size: 15px; margin-top: 8px; }
  .login-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-top: 12px; }
  .login-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .login-notice { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); font-size: 13px; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">📦</div>
  <div class="login-title" id="title">库存进出库管理系统</div>
  <div class="login-sub" id="subtitle">进出库跟踪</div>
  <div class="login-notice" id="login-notice"></div>
  <div class="login-form">
    <div class="form-group">
      <label id="lbl-user">用户名</label>
      <input id="username" type="text" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label id="lbl-pass">密码</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary login-btn" id="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-error" id="err"></div>
  </div>
  <div class="login-hint" id="hint">初始管理员账号由部署环境配置，请联系系统管理员获取</div>
</div>
<script>
(function() {
  var lang = localStorage.getItem('lang') || 'zh';
  var i18n = {
    zh: { title: '库存进出库管理系统', sub: '进出库跟踪', user: '用户名', pass: '密码', btn: '登 录', hint: '初始管理员账号由部署环境配置，请联系系统管理员获取', fail: '登录失败', netfail: '无法连接到服务器，请确认服务已启动', empty: '请输入用户名和密码', notice: '系统已重置，请使用默认管理员登录：{user} / {pass}', kicked: '该账号已在其它终端登录，当前终端已退出，请重新登录' },
    en: { title: 'Inventory Management System', sub: 'In/Out Tracking', user: 'Username', pass: 'Password', btn: 'Log In', hint: 'Initial admin credentials are configured by the deployment environment. Contact your administrator.', fail: 'Login failed', netfail: 'Cannot reach the server. Make sure the service is running.', empty: 'Please enter username and password', notice: 'The system has been reset. Log in with the default administrator: {user} / {pass}', kicked: 'This account was signed in on another device, so this session ended. Please log in again.' }
  };
  var t = i18n[lang] || i18n.zh;
  document.title = t.title;
  document.getElementById('title').textContent = t.title;
  document.getElementById('subtitle').textContent = t.sub;
  document.getElementById('lbl-user').textContent = t.user;
  document.getElementById('lbl-pass').textContent = t.pass;
  document.getElementById('btn-login').textContent = t.btn;
  document.getElementById('hint').textContent = t.hint;

  var theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);

  // 当前终端标识：同一浏览器的多个标签页共享（存在 localStorage），用于「同终端重新登录不算挤下线」
  function terminalId() {
    var id = localStorage.getItem('terminal_id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('terminal_id', id);
    }
    return id;
  }

  // 被其它终端挤下线后跳转而来：在登录页说明原因（沿用重置提示的样式）
  var qs = new URLSearchParams(location.search);
  var reason = qs.get('reason') || '';
  var next = qs.get('next') || '';
  if (!/^#[a-z]+(\?[^#\s]*)?$/.test(next)) next = ''; // 只接受站内页面 hash（可带查询参数），杜绝开放跳转
  if (reason === 'kicked') {
    var kickBox = document.getElementById('login-notice');
    kickBox.textContent = t.kicked;
    kickBox.style.display = 'block';
  }

  // 全清/重置后由前端写入的一次性提示：展示默认管理员账号
  var noticeRaw = localStorage.getItem('login_notice');
  if (noticeRaw && reason !== 'kicked') {
    try {
      var notice = JSON.parse(noticeRaw);
      var box = document.getElementById('login-notice');
      box.textContent = t.notice.replace('{user}', notice.username || '').replace('{pass}', notice.password || '');
      box.style.display = 'block';
    } catch (e) { /* 提示数据损坏时忽略 */ }
    localStorage.removeItem('login_notice');
  }

  window.doLogin = function() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var err = document.getElementById('err');
    if (!u || !p) { err.textContent = t.empty; return; }
    err.textContent = '';
    var btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = '...';
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, terminal: terminalId() })
    }).then(function(r) {
      return r.json().then(function(d) { return { ok: r.ok, data: d }; });
    }).then(function(res) {
      if (!res.ok) { err.textContent = res.data.error || t.fail; btn.disabled = false; btn.textContent = t.btn; return; }
      localStorage.setItem('token', res.data.token);
      localStorage.setItem('user', JSON.stringify(res.data.user));
      location.href = '/' + next;
    }).catch(function() {
      // 请求没有响应 = 服务没起来或网络断开，给出区别于「密码错误」的提示
      err.textContent = t.netfail; btn.disabled = false; btn.textContent = t.btn;
    });
  };

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
})();
</script>
</body>
</html>
