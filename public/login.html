<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 库存进出库管理系统</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/breakpoints.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/theme-dark.css">
<style>
  body { margin: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }
  .login-wrap { width: 360px; max-width: 92vw; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.12); padding: 40px 32px; margin: 24px 0; position: relative; }
  /* 登录页偏好按钮：与主应用右上角工具栏同款，绝对定位不占品牌位。
     登录页未加载 pages.css，这里内联同款按钮样式，保证外观一致。 */
  .login-tools { position: absolute; top: 12px; right: 12px; }
  .toolbar { display: flex; align-items: center; gap: var(--space-1_5); }
  .tool-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card-bg); color: var(--text-muted); cursor: pointer; font-size: var(--fs-lg); transition: all 0.15s; flex-shrink: 0; }
  .tool-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .tool-btn-sm { width: auto; padding: var(--space-1) var(--space-2_5); font-size: var(--fs-xs); font-weight: 500; gap: var(--space-1); }
  .login-logo { text-align: center; margin-bottom: 10px; }
  .login-logo svg { width: 44px; height: 44px; color: var(--primary); stroke-width: 1.8; }
  .login-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .login-sub { text-align: center; font-size: 12px; color: var(--text-muted); letter-spacing: .08em; margin-bottom: 28px; }
  .login-form .form-group { margin-bottom: 16px; }
  .login-form label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .login-form input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); box-sizing: border-box; }
  .login-form input:focus { outline: none; border-color: var(--primary); }
  .login-btn { width: 100%; padding: 11px; font-size: 15px; margin-top: 8px; }
  .login-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-top: 12px; }
  .login-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .login-notice { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); font-size: 13px; line-height: 1.6; text-align: center; }
  @media (max-width: 480px) {
    .login-wrap { width: auto; padding: 24px 20px; margin: 12px 16px; }
    .login-logo svg { width: 36px; height: 36px; }
    .login-title { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="toolbar login-tools">
    <button id="login-lang-btn" class="tool-btn tool-btn-sm" type="button" onclick="switchLoginLang()"></button>
    <button id="login-theme-btn" class="tool-btn" type="button" onclick="switchLoginTheme()"></button>
  </div>
  <div class="login-logo" id="login-logo"></div>
  <div class="login-title" id="title">库存进出库管理系统</div>
  <div class="login-sub" id="subtitle">进出库跟踪</div>
  <div class="login-notice" id="login-notice"></div>
  <div class="login-form">
    <div class="form-group">
      <label id="lbl-user">用户名</label>
      <input id="username" type="text" autocomplete="username" autofocus placeholder="请输入用户名">
    </div>
    <div class="form-group">
      <label id="lbl-pass">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary login-btn" id="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-error" id="err"></div>
  </div>
  <div class="login-hint" id="hint">初始管理员账号由部署环境配置，请联系系统管理员获取</div>
</div>
<script src="js/00-icons.js"></script>
<script>
(function() {
  document.getElementById('login-logo').innerHTML = window.appIcon('brand', 'icon--brand');
  // 语言与主题与主应用共用 localStorage 键：登录页切换后，进入主应用自动沿用同一偏好
  var lang = localStorage.getItem('lang') || 'zh';
  var theme = localStorage.getItem('theme') || 'light';
  var i18n = {
    zh: { title: '库存进出库管理系统', sub: '每一笔流转，都清晰可查', user: '用户名', pass: '密码', btn: '登 录', loading: '登录中…', hint: '初始管理员账号由部署环境配置，请联系系统管理员获取', fail: '登录失败', netfail: '无法连接到服务器，请确认服务已启动', empty: '请输入用户名和密码', notice: '系统已重置，请使用默认管理员登录：{user} / {pass}', kicked: '该账号已在其它终端登录，当前终端已退出，请重新登录', ph_user: '请输入用户名', ph_pass: '请输入密码', lang_tip: '切换语言', theme_tip: '切换主题' },
    en: { title: 'Inventory Management System', sub: 'Every movement, clearly traced', user: 'Username', pass: 'Password', btn: 'Log In', loading: 'Signing in…', hint: 'The initial administrator account is configured at deployment. Contact your system administrator for credentials.', fail: 'Login failed', netfail: 'Cannot reach the server. Make sure the service is running.', empty: 'Please enter username and password', notice: 'The system has been reset. Log in with the default administrator: {user} / {pass}', kicked: 'This account was signed in on another device, so this session ended. Please log in again.', ph_user: 'Enter username', ph_pass: 'Enter password', lang_tip: 'Switch language', theme_tip: 'Switch theme' }
  };
  var t = i18n[lang] || i18n.zh;

  // 被其它终端挤下线 / 全清重置的提示：只读取一次并缓存，切换语言时才能重新翻译
  var qs = new URLSearchParams(location.search);
  var reason = qs.get('reason') || '';
  var next = qs.get('next') || '';
  if (!/^#[a-z]+(\?[^#\s]*)?$/.test(next)) next = ''; // 只接受站内页面 hash（可带查询参数），杜绝开放跳转
  var noticeRaw = localStorage.getItem('login_notice');
  var loginNotice = null;
  if (noticeRaw && reason !== 'kicked') {
    try { loginNotice = JSON.parse(noticeRaw); } catch (e) { /* 提示数据损坏时忽略 */ }
    localStorage.removeItem('login_notice');
  }

  function renderNotices() {
    var box = document.getElementById('login-notice');
    if (reason === 'kicked') {
      box.textContent = t.kicked;
      box.style.display = 'block';
    } else if (loginNotice) {
      box.textContent = t.notice.replace('{user}', loginNotice.username || '').replace('{pass}', loginNotice.password || '');
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  }

  function syncThemeBtn() {
    var b = document.getElementById('login-theme-btn');
    b.innerHTML = window.appIcon(theme === 'light' ? 'moon' : 'sun', 'icon--tool');
    b.title = t.theme_tip;
    b.setAttribute('aria-label', t.theme_tip);
  }

  function applyLang(next) {
    var prev = t;
    lang = next === 'en' ? 'en' : 'zh';
    localStorage.setItem('lang', lang);
    t = i18n[lang];
    document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
    document.title = t.title;
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.sub;
    document.getElementById('lbl-user').textContent = t.user;
    document.getElementById('lbl-pass').textContent = t.pass;
    document.getElementById('btn-login').textContent = t.btn;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('username').setAttribute('placeholder', t.ph_user);
    document.getElementById('password').setAttribute('placeholder', t.ph_pass);
    var langBtn = document.getElementById('login-lang-btn');
    langBtn.textContent = lang === 'zh' ? 'EN' : '中文';
    langBtn.title = t.lang_tip;
    langBtn.setAttribute('aria-label', t.lang_tip);
    syncThemeBtn();
    // 已显示的内置错误提示随语言一起翻译；服务端返回的原文保持不动
    var err = document.getElementById('err');
    var idx = [prev.fail, prev.netfail, prev.empty].indexOf(err.textContent);
    if (idx >= 0) err.textContent = [t.fail, t.netfail, t.empty][idx];
    renderNotices();
  }

  function applyTheme(next) {
    theme = next === 'dark' ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    syncThemeBtn();
  }

  window.switchLoginLang = function() { applyLang(lang === 'zh' ? 'en' : 'zh'); };
  window.switchLoginTheme = function() { applyTheme(theme === 'light' ? 'dark' : 'light'); };

  applyLang(lang);
  applyTheme(theme);

  // 当前终端标识：同一浏览器的多个标签页共享（存在 localStorage），用于「同终端重新登录不算挤下线」
  function terminalId() {
    var id = localStorage.getItem('terminal_id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('terminal_id', id);
    }
    return id;
  }

  window.doLogin = function() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var err = document.getElementById('err');
    if (!u || !p) { err.textContent = t.empty; return; }
    err.textContent = '';
    var btn = document.getElementById('btn-login');
    var restoreBtn = function() {
      btn.disabled = false;
      btn.classList.remove('is-loading');
      btn.removeAttribute('aria-busy');
      btn.textContent = t.btn;
    };
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = '<span class="btn-spinner"></span>' + t.loading;
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, terminal: terminalId() })
    }).then(function(r) {
      return r.json().then(function(d) { return { ok: r.ok, data: d }; });
    }).then(function(res) {
      if (!res.ok) { err.textContent = res.data.error || t.fail; restoreBtn(); return; }
      // 登录态只存当前会话：关闭浏览器窗口后需要重新登录
      sessionStorage.setItem('token', res.data.token);
      sessionStorage.setItem('user', JSON.stringify(res.data.user));
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      location.href = '/' + next;
    }).catch(function() {
      // 请求没有响应 = 服务没起来或网络断开，给出区别于「密码错误」的提示
      err.textContent = t.netfail; restoreBtn();
    });
  };

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
})();
</script>
</body>
</html>
